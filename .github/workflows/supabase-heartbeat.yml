name: Supabase heartbeat

on:
  schedule:
    # Daily at 03:17 UTC (11:17 AM Asia/Manila)
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  heartbeat:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/supabase-heartbeat

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tools/supabase-heartbeat/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run heartbeat
        run: node heartbeat.js
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
